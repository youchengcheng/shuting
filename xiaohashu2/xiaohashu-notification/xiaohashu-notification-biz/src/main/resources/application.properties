server.port=8094
spring.application.name=xiaohashu-notification
spring.profiles.active=dev
# Review defaults: no listeners/capture are enabled and no schema is auto-applied.
notification.enabled=false
notification.enabled-at=${NOTIFICATION_ENABLED_AT:}
notification.stream.max-per-user=10
notification.stream.max-per-instance=1000
spring.datasource.url=${NOTIFICATION_DB_URL:jdbc:mysql://127.0.0.1:3307/xiaohashu?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai}
spring.datasource.username=${NOTIFICATION_DB_USER:root}
spring.datasource.password=${NOTIFICATION_DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.sql.init.mode=never
spring.datasource.druid.max-wait=3000
spring.datasource.druid.connection-properties=connectTimeout=2000;socketTimeout=5000
spring.data.redis.connect-timeout=2s
spring.data.redis.timeout=2s
mybatis.configuration.map-underscore-to-camel-case=true
spring.data.redis.host=${REDIS_HOST:127.0.0.1}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.cloud.nacos.discovery.server-addr=${NACOS_SERVER_ADDR:127.0.0.1:8848}
spring.cloud.nacos.discovery.namespace=${NACOS_NAMESPACE:xiaohashu}
spring.cloud.nacos.discovery.group=${NACOS_GROUP:DEFAULT_GROUP}
spring.cloud.nacos.discovery.username=${NACOS_USERNAME:}
spring.cloud.nacos.discovery.password=${NACOS_PASSWORD:}
spring.cloud.openfeign.client.config.default.connect-timeout=2000
spring.cloud.openfeign.client.config.default.read-timeout=2000
rocketmq.name-server=${ROCKETMQ_NAMESRV:127.0.0.1:9876}
rocketmq.producer.group=xiaohashu_notification_producer
internal.api.token=${INTERNAL_API_TOKEN:}
