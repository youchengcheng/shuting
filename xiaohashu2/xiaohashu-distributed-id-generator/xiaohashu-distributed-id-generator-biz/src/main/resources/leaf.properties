leaf.name=com.sankuai.leaf.opensource.test
leaf.segment.enable=true

# 本文件由 java.util.Properties 直接读取（见 PropertyFactory.java），不走 Spring，
# 因此数据库密码必须写【明文】，不能使用 application-dev.yml 中的 Druid 加密密文。
leaf.jdbc.url=jdbc:mysql://127.0.0.1:3306/leaf?useUnicode=true&characterEncoding=utf-8&autoReconnect=true&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
leaf.jdbc.username=root
leaf.jdbc.password=123456

# 开启 snowflake 模式
leaf.snowflake.enable=true
# snowflake 依赖的 zk 地址
leaf.snowflake.zk.address=127.0.0.1:2181
# snowflake 使用的端口号
leaf.snowflake.port=2222
